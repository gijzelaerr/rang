[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rangtoy"
version = "0.1.0"
description = "Python orchestration for the Rang MeerKAT calibration toy"
requires-python = ">=3.10"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
